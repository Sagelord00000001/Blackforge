[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackforge"
version = "0.1.0"
description = "AELIONIX BLACKFORGE — Autonomous Security Assessment Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AELIONIX" },
]
keywords = ["security", "pentesting", "autonomous", "assessment"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "structlog>=24.0,<25.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]
llm = [
    "torch>=2.0",
    "transformers>=4.37",
    "accelerate>=0.27",
]
colab = [
    "ipython>=8.0",
    "notebook>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["blackforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: requires real model download (not run in CI by default)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
